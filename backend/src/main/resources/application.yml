spring:
  application:
    name: spendwise
  datasource:
    url: jdbc:h2:file:./data/spendwise;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bit). Override with APP_JWT_SECRET in real environments.
    secret: ${APP_JWT_SECRET:c3BlbmR3aXNlLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS1wbGVhc2UtMzJieXRlcyE=}
    ttl: 8h
    issuer: spendwise
  cors:
    allowed-origins: http://localhost:4200
  seed-demo-data: true
